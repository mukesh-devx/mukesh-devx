<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e12" />
      <stop offset="50%" stop-color="#12151c" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Warm Amber Accent Gradient -->
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FFA826" />
      <stop offset="100%" stop-color="#FFC043" />
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#FFA826" />
    </linearGradient>

    <!-- Subtle Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
    </pattern>

    <!-- Ambient Warm Glow (Top Right) -->
    <radialGradient id="amberAmbient" cx="88%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; font-size: 40px; letter-spacing: -0.5px; fill: url(#titleGrad); }
    .role { font-size: 16px; font-weight: 600; fill: #CBD5E1; }
    .desc { font-size: 13.5px; fill: #7E8B9B; }
  </style>

  <!-- Base Card -->
  <rect width="960" height="260" rx="10" fill="url(#bgGrad)" stroke="#1F2430" stroke-width="1.5" />
  
  <!-- Grid Texture -->
  <rect width="960" height="260" rx="10" fill="url(#grid)" />

  <!-- Ambient Light -->
  <rect width="960" height="260" rx="10" fill="url(#amberAmbient)" />

  <!-- Top Accent Bar (Warm Amber) -->
  <path d="M 0 10 Q 0 0 10 0 L 950 0 Q 960 0 960 10 L 960 12 L 0 12 Z" fill="url(#amberGlow)" />

  <!-- Window Controls & Breadcrumb -->
  <g transform="translate(36, 32)">
    <circle cx="0" cy="0" r="5" fill="#EF4444" opacity="0.85" />
    <circle cx="16" cy="0" r="5" fill="#F59E0B" opacity="0.85" />
    <circle cx="32" cy="0" r="5" fill="#10B981" opacity="0.85" />
    <text x="56" y="4" class="mono" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1">MUKESH SINGH // FULL-STACK ARCHITECT</text>
  </g>

  <!-- Live Status Pill (Top Right) -->
  <g transform="translate(735, 23)">
    <rect width="190" height="26" rx="13" fill="#141820" stroke="#252D3D" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#22C55E" />
    <text x="26" y="17" class="sans" font-size="11" font-weight="600" fill="#E2E8F0">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(48, 106)">
    <text x="0" y="0" class="sans title">MUKESH SINGH</text>
    <text x="0" y="30" class="sans role">Full-Stack Engineer &amp; Founder at <tspan fill="#FFA826">GoCube Solution India</tspan></text>
    <text x="0" y="54" class="sans desc">Crafting fast, modular web platforms with clean architecture &amp; intuitive user experiences.</text>
  </g>

  <!-- Skill / Domain Pills -->
  <g transform="translate(48, 206)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="150" height="28" rx="6" fill="#141822" stroke="#222B3D" stroke-width="1" />
      <text x="75" y="18" class="mono" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">&lt; / &gt; FULL STACK</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(162, 0)">
      <rect width="180" height="28" rx="6" fill="#141822" stroke="#222B3D" stroke-width="1" />
      <text x="90" y="18" class="mono" font-size="11" font-weight="700" fill="#FFA826" text-anchor="middle">⚡ PERFORMANCE &amp; UI</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(354, 0)">
      <rect width="170" height="28" rx="6" fill="#141822" stroke="#222B3D" stroke-width="1" />
      <text x="85" y="18" class="mono" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">☁️ DEVOPS &amp; CI/CD</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(536, 0)">
      <rect width="150" height="28" rx="6" fill="#141822" stroke="#222B3D" stroke-width="1" />
      <text x="75" y="18" class="mono" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">📍 PUNE, INDIA</text>
    </g>
  </g>

  <!-- Right Side Decorative Graphic: Octocat / Code Brackets in warm amber -->
  <g transform="translate(820, 130)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="#FFA826" stroke-width="1.5" opacity="0.3" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="32" fill="#151922" stroke="#273142" stroke-width="1.5" />
    <text x="0" y="7" class="mono" font-size="22" font-weight="800" fill="#FFA826" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
