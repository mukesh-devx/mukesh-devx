<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="50%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#BC0202" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FF3333" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#EEEEEE" />
      <stop offset="100%" stop-color="#FF4D4D" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
    </pattern>

    <radialGradient id="ambientRed" cx="90%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .title { font-weight: 900; font-size: 42px; letter-spacing: -0.5px; fill: url(#textGrad); }
    .sub { font-size: 16px; font-weight: 500; fill: #94A3B8; }
    .tag { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  </style>

  <!-- Base Card -->
  <rect width="960" height="280" rx="12" fill="url(#bgGrad)" stroke="#22252e" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern -->
  <rect width="960" height="280" rx="12" fill="url(#grid)" />
  
  <!-- Ambient Glow -->
  <rect width="960" height="280" rx="12" fill="url(#ambientRed)" />

  <!-- Top Accent Line -->
  <path d="M 0 12 Q 0 0 12 0 L 948 0 Q 960 0 960 12 L 960 14 L 0 14 Z" fill="url(#redGlow)" />

  <!-- Terminal Style Window Header -->
  <g transform="translate(36, 36)">
    <circle cx="0" cy="0" r="5.5" fill="#EF4444" />
    <circle cx="18" cy="0" r="5.5" fill="#F59E0B" />
    <circle cx="36" cy="0" r="5.5" fill="#10B981" />
    <text x="62" y="4" class="mono tag" fill="#64748B">MUKESH SINGH // FOUNDER @ GOCUBE</text>
  </g>

  <!-- Status Capsule Badge -->
  <g transform="translate(730, 26)">
    <rect width="194" height="26" rx="13" fill="#151922" stroke="#2a303c" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" class="sans" font-size="11" font-weight="600" fill="#E2E8F0">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Main Identity Content -->
  <g transform="translate(48, 116)">
    <text x="0" y="0" class="sans title">MUKESH SINGH</text>
    <text x="0" y="32" class="sans sub">Founder &amp; Principal Software Architect at <tspan fill="#FF3333" font-weight="700">GoCube Solution India</tspan></text>
    <text x="0" y="58" class="sans" font-size="13.5" fill="#64748B">Specializing in High-Throughput Web Applications, Core Web Vitals &amp; Cloud CI/CD Automation</text>
  </g>

  <!-- Bottom Badges / Metrics -->
  <g transform="translate(48, 222)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="140" height="28" rx="6" fill="#13161f" stroke="#252b3b" stroke-width="1" />
      <text x="70" y="18" class="mono" font-size="11" font-weight="700" fill="#E2E8F0" text-anchor="middle">📍 PUNE, INDIA</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(150, 0)">
      <rect width="180" height="28" rx="6" fill="#13161f" stroke="#252b3b" stroke-width="1" />
      <text x="90" y="18" class="mono" font-size="11" font-weight="700" fill="#FF4D4D" text-anchor="middle">⚡ FULL STACK DEV</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(340, 0)">
      <rect width="170" height="28" rx="6" fill="#13161f" stroke="#252b3b" stroke-width="1" />
      <text x="85" y="18" class="mono" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">☁️ DEVOPS &amp; CI/CD</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(520, 0)">
      <rect width="180" height="28" rx="6" fill="#13161f" stroke="#252b3b" stroke-width="1" />
      <text x="90" y="18" class="mono" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">🚀 GOCUBE.IN</text>
    </g>
  </g>

  <!-- Right Decorative Icon / Brand Mark -->
  <g transform="translate(830, 140)">
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="#FF0000" stroke-width="2" opacity="0.3" />
    <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="none" stroke="#FF0000" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="6" fill="#FF0000" opacity="0.9" />
  </g>
</svg>
